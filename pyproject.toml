[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-orchestrator-skill"
version = "0.1.0"
description = "A specialized agent skill for breaking complex engineering tasks into sub-tasks and orchestrating specialized sub-agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Adams-404", email = "muhammadadamualiyu33@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
orchestrator = "scripts.orchestrator:main"
